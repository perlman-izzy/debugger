name: Validated Agent Bootstrap Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: validated-agent-bootstrap-20260827
      - name: Verify branch isolation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "validated-agent-bootstrap-20260827"
      - name: Credential-free free-model smoke
        run: python3 validated_agent_bootstrap/free_model_smoke.py
